[options]
; Cấu hình demo/production nhỏ (Render free 512MB, khoảng 5-10 người dùng đồng thời).
; Thông tin database và admin_passwd do deploy/render-entrypoint.sh ghi từ biến môi trường.
addons_path = /mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons
data_dir = /var/lib/odoo
proxy_mode = True
list_db = False
without_demo = all
; workers = 0: chế độ đa luồng, một tiến trình, phù hợp RAM 512MB
workers = 0
max_cron_threads = 1
limit_time_real = 300
limit_time_cpu = 120
log_level = info
