# láº§n cháº¡y má»›i há»§y láº§n cÅ©, luÃ´n cÃ³ Ä‘Ãºng má»™t lÆ°á»£t Ä‘ang ping.
name: keep-alive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping /web/health every 4 minutes
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://univ-sms-odoo.onrender.com/web/health || true)
            echo "$(date -u +%H:%M:%S) HTTP $code"
            sleep 240
          done