# Keep the Render free web service awake (Render sleeps after 15 minutes without traffic).
# GitHub schedules are best effort, so each run pings continuously for about 5h50m;
# a newer run cancels the older one, so one run is always pinging.
name: keep-alive

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-alive
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - name: Ping /web/health every 4 minutes
        run: |
          end=$(( $(date +%s) + 350*60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 120 https://univ-sms-odoo.onrender.com/web/health || true)
            echo "$(date -u +%H:%M:%S) HTTP $code"
            sleep 240
          done