# Render Blueprint: Odoo web service (free). Database dùng Postgres ngoài (Neon free),
# đặt DATABASE_URL trong Render Dashboard (sync: false = không commit giá trị bí mật).
services:
  - type: web
    name: univ-sms-odoo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /web/health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ODOO_MASTER_PASSWORD
        generateValue: true
      - key: ODOO_UPDATE_MODULES
        value: ""
