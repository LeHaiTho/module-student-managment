services:
  - type: web
    name: univ-sms-odoo
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /web/login
    envVars:
      - key: PORT
        value: "8069"
      - key: ODOO_RC
        value: /etc/odoo/odoo.conf
      - key: ODOO_AUTO_INIT
        value: "true"
      - key: ODOO_INSTALL_MODULES
        value: base
      - key: ODOO_MASTER_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: univ-sms-db
          property: connectionString

databases:
  - name: univ-sms-db
    plan: free
    region: singapore
    postgresMajorVersion: "15"
    databaseName: univ_sms
    user: odoo
